seed: 42
# self_reconstruction: i_s -> i_s; cooldown: paired i_s -> t_f.
mode: cooldown
distributed:
  # Required by the two RTX A4500 GPUs on mmplab2; disable on hosts with working P2P.
  nccl_p2p_disable: true
model:
  pretrained_model: stabilityai/stable-diffusion-3.5-medium
  dtype: bfloat16
  gradient_checkpointing: true
  max_sequence_length: 256
  lora:
    rank: 16
    alpha: 16
    dropout: 0.0
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_q
      - attn.to_v
      - attn.to_out.0
dataset:
  roots:
    - datasets/SRNet_Datagen/train/train-50k-1
    - datasets/SRNet_Datagen/train/train-50k-2
    - datasets/SRNet_Datagen/train/train-50k-3
    - datasets/SRNet_Datagen/train/train-50k-4
  resolution: 512
  limit: 200000
  font_path: null
training:
  # Hydra override examples:
  # training.output_dir=/path/to/training-output
  # training.resume_from_checkpoint=latest
  # Periodic checkpoint-* directories and lora-final are written here.
  # Keep cooldown checkpoints separate from the self-reconstruction stage.
  output_dir: CODEX/self_prompting_sd35/checkpoints/cooldown
  resume_from_checkpoint: null
  batch_size: 1
  num_workers: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_steps: 70000
  gradient_accumulation_steps: 4
  mixed_precision: bf16
  foreground_weight: 5.0
  background_weight: 1.0
  log_every: 10
  save_every: 2500
