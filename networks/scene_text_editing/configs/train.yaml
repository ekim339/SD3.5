defaults:
  - network: textctrl_sd15
  - diffusion: pndm
  - tasks/text_image_editing@task: task
  - tasks/text_image_editing/datasets@task.dataset: synthetic_textctrl
  - tasks/text_image_editing/prompts@task.prompts: prompt_set_a
  - override hydra/job_logging: disabled
  - _self_

mode: train
seed: 42
device: cuda
dtype: float32
validate_only: true
output_dir: checkpoints/textctrl/training/${now:%Y-%m-%d_%H-%M-%S}

training:
  learning_rate: 1.0e-5
  max_epochs: 100
  batch_size: 8
  accumulate_grad_batches: 8
  checkpoint_every_n_epochs: 10
  sd_locked: false
  accelerator: gpu
  strategy: ddp
  precision: 32
  # TextCtrl's released training entrypoint is isolated in its own checkout and
  # environment. Set execute=true only after preparing that environment.
  execute: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
