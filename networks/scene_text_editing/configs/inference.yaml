defaults:
  - network: textctrl_sd15
  - diffusion: pndm
  - tasks/text_image_editing@task: task
  - tasks/text_image_editing/datasets@task.dataset: dataset_a
  - tasks/text_image_editing/prompts@task.prompts: prompt_set_a
  - override hydra/job_logging: disabled
  - _self_

mode: inference
seed: 42
device: auto
dtype: auto
offline: false
validate_only: false
limit: null
overwrite: false
output_dir: experiments/results/${network.name}/${now:%Y-%m-%d_%H-%M-%S}

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
