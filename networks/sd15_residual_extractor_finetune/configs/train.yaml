seed: 42
validate_only: false

textctrl:
  repository: networks/external/TextCtrl
  python_executable: ${oc.env:TEXTCTRL_PYTHON,/home/ekim339/miniconda3/envs/textctrl/bin/python}
  checkpoint: networks/external/TextCtrl/weights/model.pth
  text_encoder_checkpoint: networks/external/TextCtrl/weights/text_encoder.pth
  ocr_checkpoint: networks/external/TextCtrl/weights/ocr_model.pth
  vgg_checkpoint: networks/external/TextCtrl/weights/vgg19.pth
  scheduler: networks/external/TextCtrl/weights/sd/scheduler/scheduler_config.json
  vae: networks/external/TextCtrl/weights/sd/vae
  unet: networks/external/TextCtrl/weights/sd/unet/diffusion_pytorch_model.bin

residual:
  checkpoint: encoders/checkpoints/residual_style/residual-style-100000.pt
  adapter_checkpoint: adapter/checkpoints/channel-adapter-latest.pt

dataset:
  roots:
    - datasets/SRNet_Datagen/train/train-50k-1
    - datasets/SRNet_Datagen/train/train-50k-2
    - datasets/SRNet_Datagen/train/train-50k-3
    - datasets/SRNet_Datagen/train/train-50k-4
  canonical_font: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
  resolution: 256
  validation_samples: 1000
  split_seed: 6101
  condition_dropout: 0.1
  limit: null
  num_workers: 8

model:
  glyph_widths: [32, 64, 128, 256, 384, 512]
  initial_style_scale: 1.0
  initial_glyph_scale: 1.0

loss:
  ocr_supervised: true
  reconstruction: true
  ocr_weight: 0.01

training:
  output_dir: networks/sd15_residual_extractor_finetune/checkpoints
  batch_size: 1
  learning_rate: 1.0e-5
  weight_decay: 0.01
  adam_epsilon: 1.0e-8
  max_steps: 50000
  max_epochs: 100
  accumulate_grad_batches: 8
  precision: 16
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  validate_every_n_steps: 500
  checkpoint_every_n_steps: 2500
  enable_checkpointing: true
  limit_val_batches: 1.0
  accelerator: gpu
  devices: 1
  strategy: auto
  resume_from: null

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
