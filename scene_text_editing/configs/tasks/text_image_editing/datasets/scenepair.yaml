name: scenepair
format: textctrl
root_dir: ${oc.env:SCENEPAIR_ROOT,scene_text_editing/data/text_image_editing/ScenePair}
source_dir: i_s
source_labels: i_s.txt
target_labels: i_t.txt
target_dir: t_f
mask_dir: null
strict: true
acquisition:
  url: https://drive.google.com/file/d/1m_o2R2kFj_hDXJP5K21aC7lKs-eUky9s/view
  full_image_directory: i_full
  source_full_mapping: i_s_full.txt
  target_full_mapping: i_t_full.txt
  note: >-
    Full-image names and crop locations are encoded in the two mapping files.
    The inference loader edits the aligned cropped i_s/t_f pairs.
